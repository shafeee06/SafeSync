openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: SafeSync - Civic Issue Reporting & Emergency Proof System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: complaints
    description: Complaint management
  - name: admin
    description: Admin panel operations
  - name: sos
    description: Emergency SOS recordings
  - name: notifications
    description: User notifications
  - name: rewards
    description: Reward points and penalties

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /complaints:
    get:
      operationId: listComplaints
      tags: [complaints]
      summary: List user's complaints
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, verified, in_progress, resolved, flagged]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: List of complaints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintListResponse"

    post:
      operationId: createComplaint
      tags: [complaints]
      summary: Submit a new complaint
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateComplaintInput"
      responses:
        "201":
          description: Complaint submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Complaint"

  /complaints/{id}:
    get:
      operationId: getComplaint
      tags: [complaints]
      summary: Get a complaint by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Complaint details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Complaint"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /complaints/{id}/delay-flag:
    post:
      operationId: raiseDelayFlag
      tags: [complaints]
      summary: Raise a delay flag for unresolved complaint
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Delay flag raised, black mark assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Complaint"
        "400":
          description: Cannot raise delay flag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sos:
    get:
      operationId: listSosRecordings
      tags: [sos]
      summary: List user's SOS recordings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of SOS recordings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SosRecordingListResponse"

    post:
      operationId: createSosRecording
      tags: [sos]
      summary: Store an emergency SOS recording
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSosRecordingInput"
      responses:
        "201":
          description: SOS recording stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SosRecording"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List user notifications
      security:
        - bearerAuth: []
      parameters:
        - name: unreadOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Notification marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /rewards/summary:
    get:
      operationId: getRewardSummary
      tags: [rewards]
      summary: Get user's reward points summary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Reward summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewardSummary"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Admin login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/complaints:
    get:
      operationId: adminListComplaints
      tags: [admin]
      summary: Admin - list all complaints
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, verified, in_progress, resolved, flagged]
        - name: department
          in: query
          schema:
            type: string
            enum: [roads, water, electricity, sanitation, general]
        - name: location
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: hasBlackMark
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: All complaints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminComplaintListResponse"

  /admin/complaints/{id}:
    get:
      operationId: adminGetComplaint
      tags: [admin]
      summary: Admin - get complaint details
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Complaint details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminComplaint"

  /admin/complaints/{id}/assign:
    patch:
      operationId: adminAssignComplaint
      tags: [admin]
      summary: Admin - assign department and update status
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAssignInput"
      responses:
        "200":
          description: Complaint updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminComplaint"

  /admin/complaints/{id}/verify:
    patch:
      operationId: adminVerifyComplaint
      tags: [admin]
      summary: Admin - manually verify a complaint
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminVerifyInput"
      responses:
        "200":
          description: Complaint verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminComplaint"

  /admin/stats:
    get:
      operationId: adminGetStats
      tags: [admin]
      summary: Admin - get dashboard statistics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/audit-logs:
    get:
      operationId: adminGetAuditLogs
      tags: [admin]
      summary: Admin - get audit logs
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    RegisterInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          minLength: 6
      required:
        - name
        - email
        - phone
        - password

    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [user, admin]
        totalPoints:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - phone
        - role
        - totalPoints
        - createdAt

    CreateComplaintInput:
      type: object
      properties:
        title:
          type: string
          minLength: 5
        description:
          type: string
          minLength: 10
        mediaUrl:
          type: string
          nullable: true
        mediaType:
          type: string
          enum: [image, video]
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        locationName:
          type: string
          nullable: true
        deviceInfo:
          type: string
          nullable: true
        urgency:
          type: string
          enum: [low, medium, high]
          default: medium
      required:
        - title
        - description

    Complaint:
      type: object
      properties:
        id:
          type: integer
        complaintId:
          type: string
        userId:
          type: integer
        title:
          type: string
        description:
          type: string
        mediaUrl:
          type: string
          nullable: true
        mediaType:
          type: string
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        locationName:
          type: string
          nullable: true
        deviceInfo:
          type: string
          nullable: true
        urgency:
          type: string
          enum: [low, medium, high]
        status:
          type: string
          enum: [pending, verified, in_progress, resolved, flagged]
        department:
          type: string
          nullable: true
        verificationScore:
          type: integer
          nullable: true
        verificationStatus:
          type: string
          enum: [unverified, verified, flagged]
          nullable: true
        earnedPoints:
          type: integer
          nullable: true
        hasBlackMark:
          type: boolean
        slaDeadline:
          type: string
          format: date-time
          nullable: true
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - complaintId
        - userId
        - title
        - description
        - urgency
        - status
        - hasBlackMark
        - createdAt
        - updatedAt

    ComplaintListResponse:
      type: object
      properties:
        complaints:
          type: array
          items:
            $ref: "#/components/schemas/Complaint"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - complaints
        - total
        - page
        - limit

    AdminComplaint:
      allOf:
        - $ref: "#/components/schemas/Complaint"
        - type: object
          properties:
            userName:
              type: string
            userEmail:
              type: string
            userPhone:
              type: string
          required:
            - userName
            - userEmail
            - userPhone

    AdminComplaintListResponse:
      type: object
      properties:
        complaints:
          type: array
          items:
            $ref: "#/components/schemas/AdminComplaint"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - complaints
        - total
        - page
        - limit

    AdminAssignInput:
      type: object
      properties:
        department:
          type: string
          enum: [roads, water, electricity, sanitation, general]
        status:
          type: string
          enum: [pending, verified, in_progress, resolved, flagged]
        slaHours:
          type: integer
          nullable: true
      required:
        - department
        - status

    AdminVerifyInput:
      type: object
      properties:
        verificationScore:
          type: integer
          minimum: 0
          maximum: 100
        verificationStatus:
          type: string
          enum: [verified, flagged]
      required:
        - verificationScore
        - verificationStatus

    AdminStats:
      type: object
      properties:
        totalComplaints:
          type: integer
        pendingComplaints:
          type: integer
        resolvedComplaints:
          type: integer
        verifiedComplaints:
          type: integer
        inProgressComplaints:
          type: integer
        flaggedComplaints:
          type: integer
        blackMarksCount:
          type: integer
        totalUsers:
          type: integer
        departmentStats:
          type: array
          items:
            $ref: "#/components/schemas/DepartmentStat"
      required:
        - totalComplaints
        - pendingComplaints
        - resolvedComplaints
        - verifiedComplaints
        - inProgressComplaints
        - flaggedComplaints
        - blackMarksCount
        - totalUsers
        - departmentStats

    DepartmentStat:
      type: object
      properties:
        department:
          type: string
        total:
          type: integer
        resolved:
          type: integer
        delayed:
          type: integer
        blackMarks:
          type: integer
      required:
        - department
        - total
        - resolved
        - delayed
        - blackMarks

    AuditLog:
      type: object
      properties:
        id:
          type: integer
        entityType:
          type: string
        entityId:
          type: integer
        action:
          type: string
        performedBy:
          type: string
        details:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - entityType
        - entityId
        - action
        - performedBy
        - createdAt

    AuditLogListResponse:
      type: object
      properties:
        logs:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - logs
        - total
        - page
        - limit

    SosRecording:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        mediaUrl:
          type: string
        mediaType:
          type: string
          enum: [audio, video]
        duration:
          type: integer
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        locationName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - mediaUrl
        - mediaType
        - createdAt

    CreateSosRecordingInput:
      type: object
      properties:
        mediaUrl:
          type: string
        mediaType:
          type: string
          enum: [audio, video]
        duration:
          type: integer
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        locationName:
          type: string
          nullable: true
      required:
        - mediaUrl
        - mediaType

    SosRecordingListResponse:
      type: object
      properties:
        recordings:
          type: array
          items:
            $ref: "#/components/schemas/SosRecording"
        total:
          type: integer
      required:
        - recordings
        - total

    Notification:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        title:
          type: string
        message:
          type: string
        type:
          type: string
          enum: [complaint_submitted, complaint_verified, complaint_routed, complaint_resolved, points_awarded, black_mark, delay_flagged]
        isRead:
          type: boolean
        relatedId:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - title
        - message
        - type
        - isRead
        - createdAt

    NotificationListResponse:
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        total:
          type: integer
        unreadCount:
          type: integer
      required:
        - notifications
        - total
        - unreadCount

    RewardSummary:
      type: object
      properties:
        totalPoints:
          type: integer
        history:
          type: array
          items:
            $ref: "#/components/schemas/RewardHistoryItem"
      required:
        - totalPoints
        - history

    RewardHistoryItem:
      type: object
      properties:
        complaintId:
          type: string
        complaintTitle:
          type: string
        points:
          type: integer
        reason:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - complaintId
        - complaintTitle
        - points
        - reason
        - createdAt
