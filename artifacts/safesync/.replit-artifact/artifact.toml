kind = "web"
previewPath = "/"
title = "SafeSync"
version = "1.0.0"
id = "artifacts/safesync"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25877

[services.development]
run = "pnpm --filter @workspace/safesync run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/safesync", "run", "build" ]
publicDir = "artifacts/safesync/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25877"
BASE_PATH = "/"
